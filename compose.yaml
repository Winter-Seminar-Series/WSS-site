networks:
  app-net:
    external: true
    name: app

services:
  postgresql:
    image: postgres
    container_name: wss-postgres
    networks:
      - app-net
    env_file:
      - .env.postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

  payment:
    # CI publishes <IMAGE_PREFIX>/wss-payment:sha-<short> and :latest — see .github/workflows/images.yml.
    image: ${PAYMENT_IMAGE:-wss:pay}
    container_name: wss-payment
    networks:
      - app-net
    restart: on-failure
    env_file:
      - .env.payment
    depends_on:
      - postgresql

  # Rate-limit counters for the backend (backend/common/throttling.py). Ephemeral by design: no persistence.
  redis:
    image: redis:7.4-alpine
    container_name: wss-redis
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory', '64mb', '--maxmemory-policy', 'volatile-ttl']
    networks:
      - app-net
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-back:TEST}
    container_name: wss-backend
    networks:
      - app-net
    restart: unless-stopped
    depends_on:
      - postgresql
      - redis
    ports:
      - 8000:8000
    env_file:
      - .env.backend
    volumes:
      - staticfiles:/var/www/static

volumes:
  postgres-data:
    driver: local
  staticfiles:
    external: true
