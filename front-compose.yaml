networks:
  app-net:
    external: true
    name: app

services:
  frontend:
    # Set FRONTEND_IMAGE to the CI image (<IMAGE_PREFIX>/wss-frontend:<tag>) and run `pull` + `up --no-build`
    # to deploy it; without it, `up --build` builds on the server as before.
    image: ${FRONTEND_IMAGE:-wss-frontend}
    build:
      context: frontend
      # Build-time values baked into the client bundle; the API is only called at runtime.
      args:
        NEXT_PUBLIC_ORIGIN: ${NEXT_PUBLIC_ORIGIN:-https://wss-sharif.com}
        GA_TRACKING_ID: ${GA_TRACKING_ID:-}
    container_name: frontend
    restart: unless-stopped
    ports:
      - 3020:3000
    networks:
      - app-net
    # Runtime: API_ORIGIN (http://backend:8000), SECRET_COOKIE_PASSWORD, WSS_ORDER — see frontend/.env.example.
    env_file:
      - .env.frontend
