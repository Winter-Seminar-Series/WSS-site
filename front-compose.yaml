networks:
  app-net:
    external: true
    name: app

services:
  frontend:
    # Defaults to the image CI publishes on GHCR. Set FRONTEND_IMAGE (e.g. <IMAGE_PREFIX>/wss-frontend:sha-<short>)
    # to pin a tag or use another registry, then `pull` + `up --no-build`; `up --build` builds on the server instead.
    image: ${FRONTEND_IMAGE:-ghcr.io/winter-seminar-series/wss-frontend:latest}
    build:
      context: frontend
      # Build-time values baked into the client bundle; the API is only called at runtime.
      args:
        NEXT_PUBLIC_ORIGIN: ${NEXT_PUBLIC_ORIGIN:-https://wss-sharif.com}
        GA_TRACKING_ID: ${GA_TRACKING_ID:-}
    container_name: wss-frontend
    restart: unless-stopped
    ports:
      - 3020:3000
    networks:
      - app-net
    # Runtime: API_ORIGIN (http://backend:8000), SECRET_COOKIE_PASSWORD — see .env.frontend.example.
    env_file:
      - .env.frontend
