# The visitor's address. Requests arrive through Cloudflare, so $remote_addr is a Cloudflare edge unless we take the
# client from CF-Connecting-IP, which is only trusted from Cloudflare's own ranges (https://www.cloudflare.com/ips/);
# a request reaching the origin directly keeps its real address and cannot spoof the header. The backend rate-limits
# by the last X-Forwarded-For hop, which every proxy below appends ($proxy_add_x_forwarded_for).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

server {
    listen 80;
    server_name wss-sharif.com;

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }
    location /10505021.txt {
        alias /tmp/10505021.txt;
    }
}

server {
    listen 5000;
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    location /static {
        alias /var/www/static;
   }
}

server {
    listen 80;
    server_name api.wss-sharif.com;

    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 20M;
    }
}

# Retired per-edition sites. Every edition is now served by the main frontend under its slug (wss-sharif.com/8th/…,
# frontend/lib/editions.ts), with the same paths as before, so old links and indexed pages keep resolving.
server {
    listen 80;
    server_name ~^(?<edition>3rd|4th|5th|6th|7th|8th|9th|10th)\.wss-sharif\.com$;

    location = / {
        return 301 https://wss-sharif.com/$edition;
    }
    location / {
        return 301 https://wss-sharif.com/$edition$request_uri;
    }
}
