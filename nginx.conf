server {
    listen 80;
    server_name wss-sharif.com;

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }
    location /10505021.txt {
        alias /tmp/10505021.txt;
    }
}

server {
    listen 5000;
    location / {
        proxy_pass http://backend:8000;
        client_max_body_size 20M;
    }

    location /static {
        alias /var/www/static;
   }
}

server {
    listen 80;
    server_name api.wss-sharif.com;

    location / {
        proxy_pass http://backend:8000;  # Point to the site running on port 3001
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 20M;
    }
}

# Retired per-edition sites. Every edition is now served by the main frontend under its slug (wss-sharif.com/8th/…,
# frontend/lib/editions.ts), with the same paths as before, so old links and indexed pages keep resolving.
server {
    listen 80;
    server_name ~^(?<edition>3rd|4th|5th|6th|7th|8th|9th|10th)\.wss-sharif\.com$;

    location = / {
        return 301 https://wss-sharif.com/$edition;
    }
    location / {
        return 301 https://wss-sharif.com/$edition$request_uri;
    }
}

server {
    listen 80;
    server_name metabase.wss-sharif.com;

    location / {
        proxy_pass http://metabase:3000;  # Point to the site running on port 3001
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

