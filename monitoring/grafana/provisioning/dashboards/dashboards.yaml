apiVersion: 1

# Dashboards are files in monitoring/grafana/dashboards. To change one: edit it in Grafana, then
# Share → Export → "Export for sharing externally" off → save the JSON over the file and commit it.
providers:
  - name: wss
    folder: WSS
    type: file
    allowUiUpdates: false
    disableDeletion: true
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana-dashboards
